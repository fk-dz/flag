<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

body {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
    scroll-behavior: smooth;
}

.header {
    text-align: center;
    padding: 30px 20px;
    margin-bottom: 30px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
}

.logo-container {
    display: inline-flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    padding: 15px 30px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    position: relative;
    overflow: hidden;
}

.logo-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: shine 3s infinite;
}

@keyframes shine {
    0% { transform: translateX(-100%) translateY(-100%); }
    100% { transform: translateX(100%) translateY(100%); }
}

.logo-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 28px;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 1;
}

.logo-text {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #fff, #ffd700, #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    z-index: 1;
}

.header h1 {
    font-size: 2.5em;
    margin: 15px 0;
    background: linear-gradient(90deg, #fff, #87ceeb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header p { color: #b0c4de; font-size: 1.1em; }

.developer {
    margin-top: 15px;
    font-size: 1em;
    color: #ffd700;
    font-weight: bold;
}

.controls {
    max-width: 1400px;
    margin: 0 auto 20px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
}

.search-box {
    flex: 1;
    min-width: 250px;
    max-width: 500px;
    position: relative;
}

.search-input {
    width: 100%;
    padding: 15px 50px 15px 20px;
    border: none;
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    outline: none;
    transition: all 0.3s;
}

.search-input::placeholder { color: rgba(255,255,255,0.6); }
.search-input:focus { background: rgba(255,255,255,0.15); border-color: #ffd700; }

.filter-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1400px;
    margin: 0 auto 30px;
}

.filter-btn {
    padding: 10px 20px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    background: rgba(255,255,255,0.05);
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 14px;
    backdrop-filter: blur(10px);
}

.filter-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
.filter-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: transparent; }
.filter-btn.arab-btn.active { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }

.stats {
    text-align: center;
    margin-bottom: 20px;
    color: #ffd700;
    font-size: 1.1em;
}

.countries-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
    max-width: 1400px;
    margin: 0 auto;
}

.country-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s ease;
    position: relative;
}

.country-card.arab {
    border: 2px solid rgba(17,153,142,0.5);
}

.country-card.arab::before {
    content: '🌙';
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(17,153,142,0.9);
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 12px;
    z-index: 2;
}

.country-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    border-color: #ffd700;
}

.flag-container {
    width: 100%;
    height: 180px;
    overflow: hidden;
    background: #1a2a3a;
    display: flex;
    align-items: center;
    justify-content: center;
}

.flag-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
}

.country-card:hover .flag-img { transform: scale(1.1); }

.country-info { padding: 20px; }

.country-name {
    font-size: 1.4em;
    font-weight: bold;
    margin-bottom: 15px;
    text-align: center;
    color: #ffd700;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.1);
    font-size: 0.95em;
    gap: 10px;
}

.info-row:last-child { border-bottom: none; }
.info-label { color: #87ceeb; font-weight: bold; white-space: nowrap; }
.info-value { color: #fff; text-align: left; }

.info-row.independence {
    background: rgba(255,215,0,0.05);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 5px;
}

.info-row.independence .info-value {
    color: #ffd700;
    font-weight: bold;
}

.colonizer {
    display: block;
    font-size: 0.85em;
    color: #ff9800;
    margin-top: 3px;
    font-style: italic;
}

.footer {
    text-align: center;
    margin-top: 50px;
    padding: 20px;
    color: rgba(255,255,255,0.8);
    border-top: 1px solid rgba(255,255,255,0.1);
}

.footer strong { 
    color: #ffd700;
    font-size: 1.2em;
}

/* ===== زر الرجوع للأعلى ===== */
.back-to-top {
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(102,126,234,0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 9999;
}

.back-to-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.back-to-top:hover {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    transform: translateY(-5px) scale(1.1);
    box-shadow: 0 12px 30px rgba(240,147,251,0.6);
}

.back-to-top:active {
    transform: translateY(-2px) scale(1.05);
}

.back-to-top::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    opacity: 0.5;
    animation: pulse 2s infinite;
    z-index: -1;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.5); opacity: 0; }
}

@media (max-width: 768px) {
    .header h1 { font-size: 1.8em; }
    .logo-text { font-size: 24px; }
    .logo-icon { width: 45px; height: 45px; font-size: 20px; }
    .back-to-top {
        width: 48px;
        height: 48px;
        bottom: 20px;
        left: 20px;
        font-size: 20px;
    }
}

let filteredCountries = [...countriesData];
let currentFilter = 'all';

function updateStats() {
    document.getElementById('stats').innerHTML = 
        `📊 عدد الدول المعروضة: <strong>${filteredCountries.length}</strong> من أصل <strong>${countriesData.length}</strong> | 🌙 الدول العربية: <strong>${countriesData.filter(c=>c.arab).length}</strong>`;
}

function renderCountries() {
    const grid = document.getElementById('countriesGrid');
    grid.innerHTML = '';
    
    if (filteredCountries.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#ffd700;">🔍 لا توجد نتائج مطابقة</div>';
        return;
    }

    filteredCountries.forEach(country => {
        const card = document.createElement('div');
        card.className = 'country-card' + (country.arab ? ' arab' : '');
        card.innerHTML = `
            <div class="flag-container">
                <img src="https://flagcdn.com/w640/${country.c}.png" 
                     alt="${country.n}" 
                     class="flag-img" 
                     loading="lazy"
                     onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'font-size:80px;\\'>🏳️</div>'">
            </div>
            <div class="country-info">
                <div class="country-name">${country.n}</div>
                <div class="info-row independence">
                    <span class="info-label">📅 تاريخ الاستقلال:</span>
                    <span class="info-value">${country.f}<span class="colonizer">⚔️ من: ${country.col}</span></span>
                </div>
                <div class="info-row"><span class="info-label">👥 السكان:</span><span class="info-value">${country.pop}</span></div>
                <div class="info-row"><span class="info-label">📏 المساحة:</span><span class="info-value">${country.area} كم²</span></div>
                <div class="info-row"><span class="info-label">🗣️ اللغة:</span><span class="info-value">${country.lang}</span></div>
                <div class="info-row"><span class="info-label">🌍 القارة:</span><span class="info-value">${country.cont}</span></div>
                <div class="info-row"><span class="info-label">🏛️ العاصمة:</span><span class="info-value">${country.cap}</span></div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterCountries() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    filteredCountries = countriesData.filter(country => {
        const matchesSearch = !searchTerm || 
            country.n.toLowerCase().includes(searchTerm) || 
            country.cap.toLowerCase().includes(searchTerm);
        let matchesFilter = true;
        if (currentFilter === 'all') matchesFilter = true;
        else if (currentFilter === 'arab') matchesFilter = country.arab === true;
        else matchesFilter = country.cont === currentFilter;
        return matchesSearch && matchesFilter;
    });
    updateStats();
    renderCountries();
}

document.getElementById('searchInput').addEventListener('input', filterCountries);

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        filterCountries();
    });
});

updateStats();
renderCountries();
</script>
